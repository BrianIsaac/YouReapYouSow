[project]
name = "youreapyousow"
version = "0.1.0"
description = "YouReapYouSow: accountability challenges with a shared pool, scored by a locked rubric, the prize bought through Reap's Agentic module behind an authority gate and a hash-chained ledger."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youreapyousow"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "D", "ANN", "ASYNC", "PT", "RET", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "D100", "D104"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not live'"
markers = ["live: hits real provider endpoints over the network (opt in with -m live)"]

[tool.coverage.run]
source = ["youreapyousow"]
branch = true

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

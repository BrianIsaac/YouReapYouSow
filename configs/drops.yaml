# The drops on offer: each its own prize, entry, seats and fixed date range. The first is
# featured (the un-keyed routes act on it). Prices: the merchant sheet of 9 October 2026;
# the sandbox prices the four Singapore merchants in SGD, which the gate does not buy (the
# pool is test USDC, so the budget is USD), so those buy on the mock, where they are listed
# at illustrative USD prices. Entries are sized so three clear the landed quote after the
# 10% buffer.
drops:
  - id: keychron-b40
    title: Earn your Keychron B40
    purchase: purchase-prize.yaml
    list_price: "49.99"
    currency: USD
    entry_amount: "25.00"
    duration_days: 28
    live_purchase: true
